[project]
name = "blackwell-coordinator"
version = "1.0.0"
description = "GPU job coordinator for a shared Blackwell workstation, with a single-tool Cursor MCP (activate)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "mcp>=1.2",
    "psutil>=7.2.2",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coordinator", "blackwell_mcp", "blackwell_app"]

[project.scripts]
blackwell-coordinator = "coordinator.main:run"
blackwell-mcp = "blackwell_mcp.server:main"
blackwell-app = "blackwell_app.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
